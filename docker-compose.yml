services:
  smriva:
    build: .
    ports:
      - '${SMRIVA_BIND:-127.0.0.1}:3001:3001'
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DEMO_JUDGE_MODE: ${DEMO_JUDGE_MODE:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      HUB_ENCRYPTION_KEY: ${HUB_ENCRYPTION_KEY:-}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      DEMO_ENROLLMENT_CODE: ${DEMO_ENROLLMENT_CODE:-setusync-demo-2026}
      ALLOWED_ORIGIN: http://localhost:3001
      SITE_URL: ${SITE_URL:-}
    volumes:
      - kuka-data:/app/data
    restart: unless-stopped
volumes:
  kuka-data:
